# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Root-relative internal links resolve against our published site, so they land
# under the excluded lsimons.github.io domain below. This is the root user
# site, so the base is the domain root.
#
# NOTE: nothing currently validates root-relative internal links. This comment
# used to claim "the Astro build validates them for real"; it does not. Astro 7
# ships no built-in link validation and `starlight-links-validator` is not
# installed, so a link to a page that does not exist builds and deploys clean
# (verified by adding one and building). There are no such links today — the
# site is a single page — but adding one would go unchecked. Closing the gap
# means adding the `starlight-links-validator` Starlight plugin.
base_url = "https://lsimons.github.io/"

# 429 (rate limited) and 403 (bot-protected) are not broken links; accept them
# so the pre-commit hook does not flake on external hosts.
accept = ["100..=299", "403", "429"]

# - Our own published URL: the deploy workflow proves it, and checking it is a
#   chicken-and-egg problem on the first deploy (and internal links resolve
#   against it, see base_url above).
# - localhost: the dev-server URL referenced in docs is not reachable in CI.
# - schubergphilis.com: bot-protected, returns 403 to link checkers.
# - `[{}]` / `%7B`: JSX expressions in .mdx (e.g. `href={repo.url}`) that lychee
#   mis-parses as literal URLs.
exclude = [
  '^https?://lsimons\.github\.io/',
  '^http://localhost',
  '^https://schubergphilis\.com',
  '[{}]',
  '%7[BD]',
]
